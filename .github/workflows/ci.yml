name: CI

# The enforced regression gate. For a project whose entire value is integrity, a green
# run is the barrier: a single false-positive in the moat, a failing test, or coverage
# below the integrity-core floor fails the build. Runs on every push and PR.
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (engine + heavy deps + dev tools)
        run: python -m pip install -e ".[math,signing,schema,dev]"

      # Fails ONLY on what is unambiguously broken — syntax errors, undefined names, misuse.
      # The rule set (E9, F63, F7, F82) is pinned in pyproject.toml [tool.ruff.lint]; style is
      # deliberately not enforced.
      - name: Lint (syntax errors, undefined names, misuse only)
        run: python -m ruff check src tools tests

      # ROUTING-BASIS DIFF (issue #31). The resolver's phrase->domain index is harvested from every
      # verifier's docstring, so editing ANY verifier can move ANOTHER domain's routing — on 2026-10-16
      # "prime implicants" in formal_logic turned "is 17 prime" from a decision into a question, and the
      # PR's diff never showed it. Build the index on the base branch (a throwaway worktree) and on this
      # checkout, write what moved to the step summary, and FAIL when a pinned golden query's decision
      # flips (then the PR must say why and move the pin deliberately). Skipped on master itself: no base.
      - name: "Routing-basis diff against the base branch (issue #31)"
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git worktree add --detach /tmp/base "origin/$BASE_REF"
          python tools/routing_diff.py snapshot /tmp/routing_base.json --root /tmp/base
          python tools/routing_diff.py snapshot /tmp/routing_head.json
          status=0
          python tools/routing_diff.py compare /tmp/routing_base.json /tmp/routing_head.json --fail-on-flip \
            > /tmp/routing_diff.md || status=$?
          cat /tmp/routing_diff.md
          { echo "## Routing-basis diff: origin/$BASE_REF -> this checkout"; echo; cat /tmp/routing_diff.md; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Moat benchmark — every case correct with 0 false-positives
        run: python tools/benchmark.py   # exits non-zero on any false-positive

      - name: Test suite (with coverage)
        run: coverage run --source=src/concordance -m pytest -q

      - name: Coverage report
        run: coverage report

      # The integrity core: the content-addressed store, the ledger, records, signing, validation,
      # receipts and the derivation moat — plus the airlock, audit, seals and attestation paths that
      # sit on the same trust boundary. The floor only ever ratchets up.
      - name: Integrity-core coverage floor (cas/ledger/record/signing/validate/receipts/derivation/airlock/audit/seals/attest)
        run: >
          coverage report
          --include="*/cas.py,*/ledger.py,*/record.py,*/signing.py,*/validate.py,*/receipts.py,*/derivation.py,*/airlock.py,*/audit.py,*/seals.py,*/attest.py"
          --fail-under=75

  windows:
    # The maintainer develops on Windows: prove the engine installs, the moat holds, and the fast
    # structural tests pass there too (path separators, console encoding, line endings).
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (engine + heavy deps + dev tools)
        run: python -m pip install -e ".[math,signing,schema,dev]"

      - name: Moat benchmark — every case correct with 0 false-positives
        run: python tools/benchmark.py

      - name: Fast structural tests
        run: >
          pytest -q
          tests/test_five_doors.py
          tests/test_mcp_profiles.py
          tests/test_tool_dispatch_parity.py
          tests/test_domain_resolver.py
          tests/test_logic_front_door.py
          tests/test_formal_logic.py
