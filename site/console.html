<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Console — Narrow Highway</title>
<meta name="description" content="One console: ask or speak anything, and the keeping answers — read it as a book, or listen as a radio. The coach guides; every answer shows how it was found, verified, and cited. Found, never generated.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
  /* THE CONSOLE — a reverent instrument. Illuminated manuscript meets a brass device you consult:
     Hitchhiker's-Guide warmth, cathedral reverence, steampunk craft. Parchment & brass by day; a
     candlelit cathedral by night. Still by default — motion is slight, mechanical, and opt-out
     (docs/CONSOLE.md: high-contrast serif, page-not-scroll, complete in one frame). */
  :root{
    --paper:#f1ece0; --panel:#e9e2d1; --ink:#1b1712; --ink-soft:#574e42; --dim:#8a8070;
    --line:#d3c9b4; --hair:#e2dac7; --brass:#9a7623; --brass-lit:#b78f36; --copper:#9c5a36;
    --seal:#8c2f23; --rule:#2a241b;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --plaque:ui-sans-serif,system-ui,'Segoe UI',sans-serif;
    --mono:ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --paper:#12121a; --panel:#1a1a23; --ink:#ece5d4; --ink-soft:#a79d8a; --dim:#746b5a;
    --line:#2b2934; --hair:#232230; --brass:#cfa54c; --brass-lit:#e4bf6a; --copper:#c97d55;
    --seal:#c45a49; --rule:#ece5d4; color-scheme:dark; }}
  :root[data-theme="dark"]{ --paper:#12121a; --panel:#1a1a23; --ink:#ece5d4; --ink-soft:#a79d8a;
    --dim:#746b5a; --line:#2b2934; --hair:#232230; --brass:#cfa54c; --brass-lit:#e4bf6a;
    --copper:#c97d55; --seal:#c45a49; --rule:#ece5d4; color-scheme:dark; }
  *{ box-sizing:border-box }
  html,body{ margin:0; background:var(--paper); color:var(--ink) }
  body{ font-family:var(--serif); line-height:1.62; -webkit-font-smoothing:antialiased;
        text-rendering:optimizeLegibility; }
  /* motion: slight and mechanical, never flashy — and off entirely when the reader asks for stillness */
  @media (prefers-reduced-motion:no-preference){
    .mode button,.act,.conn button,.conn .go,.weave .chip,.weave .orig .ow,.weave .wstudy .uses,
    .weave .deep .seal,.ask input,.ask #go,.ask .mic,.src a,.word,.rootlead a{
      transition:color .18s ease, border-color .18s ease, background-color .18s ease }
    #page>*{ animation:settle .5s ease both }
    @keyframes settle{ from{ opacity:0; transform:translateY(.3rem) } to{ opacity:1; transform:none } }
  }
  .book{ max-width:41rem; margin:0 auto; min-height:100svh; display:flex; flex-direction:column;
         padding:calc(1rem + env(safe-area-inset-top)) 1.35rem calc(1rem + env(safe-area-inset-bottom)); }

  /* the lintel — an engraved nameplate under a brass cornice */
  header.bar{ display:flex; align-items:center; justify-content:space-between; gap:1rem;
              padding-bottom:.7rem; border-bottom:1px solid var(--brass); box-shadow:0 1px 0 var(--hair) }
  .brand{ font-family:var(--plaque); font-size:.74rem; letter-spacing:.2em; text-transform:uppercase;
          color:var(--dim); text-decoration:none; display:inline-flex; align-items:center; gap:.5em }
  .brand b{ color:var(--brass); font-weight:600; letter-spacing:.16em }
  .brand .fleur{ color:var(--brass); font-size:1.05em; line-height:1 }

  /* the brass switch — Listen / Read */
  .mode{ display:inline-flex; border:1px solid var(--brass); border-radius:3px; overflow:hidden; background:var(--panel) }
  .mode button{ font-family:var(--plaque); font-size:.68rem; letter-spacing:.15em; text-transform:uppercase;
                background:none; color:var(--dim); border:0; padding:.36rem .72rem; cursor:pointer;
                display:inline-flex; align-items:center; gap:.42em }
  .mode button+button{ border-left:1px solid var(--brass) }
  .mode button[aria-pressed="true"]{ background:var(--brass); color:var(--paper) }
  .mode button svg{ width:.92em; height:.92em }

  main.page{ flex:1 0 auto; padding:2.1rem 0 1rem }
  .greet{ color:var(--ink-soft); font-family:var(--display); font-style:italic; font-size:1.42rem;
          line-height:1.42; margin:0 0 1.5rem; max-width:34rem }
  .headline{ font-family:var(--display); font-size:2.7rem; line-height:1.06; margin:.1rem 0 1rem;
             font-weight:600; letter-spacing:.004em; text-wrap:balance; color:var(--ink) }
  .body{ font-size:1.2rem; line-height:1.66 }
  .body p{ margin:.2rem 0 1.05rem }
  .vn{ color:var(--brass); font-size:.64em; vertical-align:super; margin-right:.32em; font-family:var(--plaque); font-weight:600 }
  .word{ cursor:pointer; border-bottom:1px dotted var(--line) }
  .word:hover{ border-bottom-color:var(--brass); color:var(--brass) }
  .src{ color:var(--dim); font-family:var(--plaque); font-size:.78rem; letter-spacing:.03em; margin:.5rem 0 1.2rem }
  .src a{ color:var(--brass); text-decoration:none; border-bottom:1px solid transparent }
  .src a:hover{ border-bottom-color:var(--brass) }
  /* a verdict — a wax seal struck on the page: certified true, false, or honestly declined */
  .verdict{ font-family:var(--plaque); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
            display:inline-flex; align-items:center; gap:.45em; padding:.3rem .8rem; border:1px solid var(--brass);
            color:var(--brass); border-radius:2px; margin:0 0 1rem; background:var(--panel) }
  .verdict.no{ border-color:var(--seal); color:var(--seal) }
  .verdict.na{ border-color:var(--line); color:var(--dim) }
  /* render 2 — the Word under an answer: the verse its subject is rooted in (a quiet lead line) */
  .rootlead{ font-family:var(--plaque); font-size:.8rem; color:var(--dim); margin:-.3rem 0 1.1rem }
  .rootlead b{ color:var(--brass); font-weight:600; font-family:var(--display); font-size:1.14em }
  /* the engine trail — a brass instrument's readout of how the answer was found; one frame */
  .trail{ border-top:1px solid var(--hair); border-bottom:1px solid var(--hair); padding:.6rem 0; margin:1.4rem 0;
          font-family:var(--mono); font-size:.68rem; letter-spacing:.01em; color:var(--dim);
          display:flex; flex-wrap:wrap; align-items:center; gap:.5rem }
  .trail .lab{ text-transform:uppercase; letter-spacing:.14em; color:var(--ink); opacity:.5 }
  .trail .step{ white-space:nowrap }
  .trail .step b{ color:var(--ink); font-weight:600 }
  .trail .arr{ color:var(--brass); opacity:.65 }
  .trail .seal{ color:var(--brass) }
  /* connections — the coach pointing on */
  .conn{ margin:1.2rem 0 }
  .conn .lab{ font-family:var(--plaque); font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--dim) }
  .conn button, .conn .go{ display:block; width:100%; text-align:left; font-family:var(--serif); font-size:1.08rem; background:none;
                border:0; border-bottom:1px solid var(--hair); color:var(--ink); padding:.58rem 0; cursor:pointer;
                text-decoration:none }
  .conn button:hover, .conn .go:hover{ color:var(--brass); border-bottom-color:var(--brass) }
  .conn button::before, .conn .go::before{ content:"❧"; color:var(--brass); font-size:.9em; margin-right:.55em }
  .conn .go::after{ content:" ↗"; color:var(--dim); font-size:.8em }  /* leaves the console to a reader page */
  /* the woven entry — the Word connected to everything: reality, cross-refs, original, commentary */
  .weave{ border-top:1px solid var(--brass); margin:1.6rem 0 0; padding-top:1.1rem }
  .weave .wlab{ font-family:var(--plaque); font-size:.66rem; letter-spacing:.22em; text-transform:uppercase;
                color:var(--brass); margin:0 0 1.1rem; display:flex; align-items:center; gap:.7em }
  .weave .wlab::before, .weave .wlab::after{ content:""; height:1px; background:var(--hair); flex:1 }
  .weave .dim-row{ margin:0 0 1.15rem }
  .weave .dim-row .k{ font-family:var(--plaque); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
                      color:var(--dim); display:block; margin:0 0 .4rem }
  .weave .chip{ font-family:var(--serif); font-size:.98rem; background:var(--panel); border:1px solid var(--hair);
                border-radius:2px; color:var(--ink); padding:.2rem .55rem; margin:0 .4rem .4rem 0; cursor:pointer; display:inline-block }
  .weave .chip:hover{ color:var(--brass); border-color:var(--brass) }
  .weave .orig{ font-family:var(--display); font-size:1.5rem; line-height:1.85; direction:ltr }
  .weave .orig .ow{ cursor:pointer; border-bottom:1px dotted transparent; padding:0 .05em }
  .weave .orig .ow:hover{ border-bottom-color:var(--brass); color:var(--brass) }
  .weave .orig .ow.doubt{ color:var(--brass); border-bottom:1px solid var(--brass) }  /* kept in the tongue */
  .weave .wstudy{ margin:.7rem 0 0; font-size:1rem; line-height:1.56; color:var(--ink);
                  border-left:2px solid var(--brass); padding:.15rem 0 .15rem .85rem;
                  background:linear-gradient(90deg,var(--panel),transparent 65%) }
  .weave .wstudy .tl{ font-style:italic; color:var(--copper); font-family:var(--display); font-size:1.12em }
  .weave .wstudy .uses{ display:inline-block; margin-top:.4rem; font-size:.8rem; color:var(--brass); cursor:pointer;
                        font-family:var(--plaque) }
  .weave .wstudy .uses:hover{ text-decoration:underline }
  .weave .cmt{ font-size:1.04rem; color:var(--ink); line-height:1.6 }
  .weave .cmt .who{ color:var(--copper); font-family:var(--plaque); font-size:.74rem; letter-spacing:.03em; font-style:normal; display:block; margin-top:.35rem }
  /* go deep — tap a reality node to open its verified, sealed math (the inner workings) */
  .weave .deep{ margin:.8rem 0 0; border-left:2px solid var(--ink); padding:.15rem 0 .15rem .85rem }
  .weave .deep .dtitle{ font-family:var(--display); font-weight:600; font-size:1.34rem; margin:0 0 .4rem }
  .weave .deep .dstmt{ font-size:1rem; margin:0 0 .7rem; color:var(--ink-soft) }
  .weave .deep .dmark{ font-size:.96rem; margin:0 0 .55rem; padding-left:.85rem; border-left:1px solid var(--hair) }
  .weave .deep .dmark .mk{ font-family:var(--plaque); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); display:block; margin-bottom:.12rem }
  .weave .deep .seal{ color:var(--brass); font-size:.76rem; font-family:var(--plaque); text-decoration:none; margin-left:.35rem; white-space:nowrap }
  .weave .deep .seal:hover{ text-decoration:underline }
  .weave .deep .dopen{ color:var(--dim); font-size:.92rem; font-style:italic; margin:.5rem 0 0 }
  /* the ask bar — a brass query line: type or speak */
  .ask{ position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--brass);
        padding:.75rem 0 calc(.4rem + env(safe-area-inset-bottom)); display:flex; gap:.5rem; align-items:center }
  .ask input{ flex:1 1 auto; font-family:var(--serif); font-size:1.08rem; background:none; border:0; border-bottom:1px solid var(--line);
              color:var(--ink); padding:.5rem .3rem; min-width:0 }
  .ask input::placeholder{ color:var(--dim); font-style:italic }
  .ask input:focus{ outline:none; border-bottom-color:var(--brass) }
  .ask #go{ font-family:var(--plaque); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;
               background:var(--brass); color:var(--paper); border:1px solid var(--brass); border-radius:3px;
               padding:.5rem 1rem; cursor:pointer; display:inline-flex; align-items:center; gap:.45em }
  .ask #go:hover{ background:var(--brass-lit); border-color:var(--brass-lit) }
  .ask #go svg{ width:.95em; height:.95em }
  .ask .mic{ background:var(--panel); color:var(--ink-soft); border:1px solid var(--line); border-radius:3px;
             padding:.42rem .52rem; cursor:pointer; display:inline-flex; align-items:center }
  .ask .mic svg{ width:1.05rem; height:1.05rem }
  .ask .mic[aria-pressed="true"]{ border-color:var(--brass); color:var(--brass) }
  /* instrument buttons — Listen / Keep / Copy */
  .row{ display:flex; gap:.7rem; align-items:center; flex-wrap:wrap; margin:.3rem 0 1rem }
  .act{ font-family:var(--plaque); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
        background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:.4rem .8rem; cursor:pointer;
        display:inline-flex; align-items:center; gap:.5em }
  .act svg{ width:.95em; height:.95em }
  .act[aria-pressed="true"], .act:hover{ color:var(--brass); border-color:var(--brass) }
  .dim{ color:var(--dim) }
  .kept{ color:var(--brass); font-size:.78rem; letter-spacing:.06em; font-family:var(--plaque) }
  /* the colophon */
  footer{ color:var(--dim); font-family:var(--plaque); font-size:.7rem; letter-spacing:.03em; text-align:center;
          border-top:1px solid var(--hair); padding-top:.95rem; margin-top:1.4rem }
  footer .fleur{ color:var(--brass); display:block; margin-bottom:.35rem; font-size:1.15rem; line-height:1 }

  /* THE LANDING — the instrument proves itself: a worked check runs as the hero, then it invites your own.
     No menu, no jargon, no guessing — you learn it by watching one answer work. */
  .hero-line{ font-family:var(--display); font-size:2.6rem; line-height:1.06; font-weight:600; margin:.1rem 0 .55rem; text-wrap:balance; color:var(--ink) }
  .hero-sub{ color:var(--ink-soft); font-size:1.12rem; line-height:1.5; margin:0 0 1.3rem; max-width:34rem }
  .hero-sub b{ color:var(--brass); font-weight:600 }
  .demo{ border:1px solid var(--brass); border-radius:4px; background:var(--panel); padding:1.15rem 1.1rem .95rem; margin:0 0 1.5rem; position:relative }
  .demo .tag{ position:absolute; top:-.6rem; left:1rem; background:var(--paper); padding:0 .5rem; font-family:var(--plaque); font-size:.6rem; letter-spacing:.18em; text-transform:uppercase; color:var(--brass) }
  .demo .claim{ font-family:var(--display); font-size:1.5rem; line-height:1.18; margin:.15rem 0 .7rem; color:var(--ink) }
  .demo .verdict{ margin:0 0 .7rem }
  .demo .body{ font-size:1.04rem; line-height:1.55 }
  .demo .body p{ margin:.1rem 0 .5rem }
  .demo .d-src{ color:var(--dim); font-family:var(--plaque); font-size:.72rem; letter-spacing:.03em; margin:.55rem 0 0 }
  .demo .trail{ margin:.8rem 0 0 }
  .invite .inv-lab{ font-family:var(--display); font-style:italic; font-size:1.35rem; color:var(--ink-soft); margin:0 0 .75rem }
  .examples{ display:flex; flex-direction:column; gap:.5rem; margin:0 0 1rem }
  .examples button{ text-align:left; font:inherit; font-family:var(--serif); font-size:1.02rem; background:var(--panel); border:1px solid var(--line);
                    border-radius:3px; color:var(--ink); padding:.55rem .8rem; cursor:pointer; display:flex; align-items:baseline; gap:.65em; flex-wrap:wrap }
  .examples button:hover{ border-color:var(--brass) }
  .examples button .ex-k{ font-family:var(--plaque); font-size:.6rem; letter-spacing:.13em; text-transform:uppercase; color:var(--brass); min-width:6.2rem; flex:0 0 auto }
  .examples button .ex-q{ color:var(--ink-soft); font-style:italic }
  .examples button:hover .ex-q{ color:var(--brass) }
  .another{ font-family:var(--plaque); font-size:.72rem; letter-spacing:.06em; color:var(--brass); background:none; border:0; cursor:pointer; padding:.2rem 0; display:inline-flex; align-items:center; gap:.4em }
  .another:hover{ text-decoration:underline }
</style>
</head>
<body>
<div class="book">
  <header class="bar">
    <a class="brand" href="/"><span class="fleur" aria-hidden="true">&#10070;</span>Narrow&nbsp;<b>Highway</b> &middot; the console</a>
    <span class="mode" role="group" aria-label="Listen or read">
      <button id="m-listen" aria-pressed="false" title="Listen — it reads to you, hands-free">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h3.5L13 19V5L7.5 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>Listen</button>
      <button id="m-read" aria-pressed="true" title="Read — the page rests; study at your own pace">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5.1 7.5 4.4 4.5 4.4V17c3 0 5.5.7 7.5 2.1 2-1.4 4.5-2.1 7.5-2.1V4.4c-3 0-5.5.7-7.5 2.1z"/><path d="M12 6.5v12.6"/></svg>Read</button>
    </span>
  </header>

  <main class="page" id="page">
    <p class="greet" id="greet">Speak or type anything — a verse, a question, a note to keep. I'll find it,
      check it, and read it to you; the page holds still while you listen, or rests while you read.</p>
  </main>

  <div class="ask">
    <button class="mic" id="mic" title="Speak" aria-label="Speak" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21M8.5 21h7"/></svg>
    </button>
    <input id="q" placeholder="a verse · define a word · check a claim · a situation you're facing · note that…" aria-label="Ask or speak" autocomplete="off">
    <button id="go" title="Consult the keeping">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4C13.5 5.5 8.5 10.5 6.5 17L5 20.5"/><path d="M6.5 17c2.5 0 4-.8 5.2-2"/><path d="M13.5 7.2l3.3 3.3"/></svg>Ask</button>
  </div>
  <footer><span class="fleur" aria-hidden="true">&#10070;</span>Found, verified, and cited — never generated. A window to Him, not a wall. <a href="/books.html" style="color:var(--brass,#9a7623);text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap">Read the library &rarr;</a></footer>
</div>

<script src="speak.js"></script>
<script>
const API = "";                       // same-origin on the box; falls back to a sample in preview
const pageEl = document.getElementById('page');
const qEl = document.getElementById('q');
let MODE = (function(){ try{ return localStorage.getItem('nh-console-mode') || 'read'; }catch(e){ return 'read'; } })();

function esc(s){ const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function setMode(m){
  MODE=m;
  document.getElementById('m-listen').setAttribute('aria-pressed', m==='listen');
  document.getElementById('m-read').setAttribute('aria-pressed', m==='read');
  try{ localStorage.setItem('nh-console-mode', m); }catch(e){}
}
document.getElementById('m-listen').onclick = ()=>{ setMode('listen'); if(window._lastSpoken) speak(window._lastSpoken); };
document.getElementById('m-read').onclick = ()=>{ setMode('read'); try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} };
setMode(MODE);

function speak(text){ if(text && window.NHSpeak) NHSpeak.play(text); }

// THE ENGINE TRAIL — a calm, static schematic of how THIS answer was found. Built from the reply's
// own fields (the door it took, whether it was verified/sealed, the source it cites). One frame, no motion.
function trailOf(r){
  // the door it entered
  const door = ({check:'check', ask:'asked', walk:'asked', find:'find', word:'the word', read:'the word',
                 crisis:'crisis net', dictate:'kept', schedule:'schedule', copies:'copies', learn:'the cube'})[r.intent] || 'asked';
  const steps = ['<span class="step"><span class="lab">from</span> <b>'+esc(door)+'</b></span>'];
  // the work it did — the verifier that carried it (what the engine actually ran)
  const checked = ({verify:'verified', define:'defined', word:'read in the original', search:'found in the keeping',
                    scripture:'read from the keeping', scripture_original:'read in the original',
                    coach:'matched to the path', note:'written verbatim', crisis:'real people first'})[r.kind];
  if(checked) steps.push('<span class="step"><b>'+esc(checked)+'</b></span>');
  if(r.source && (r.source.title||r.source.ref)) steps.push('<span class="step"><span class="lab">source</span> <b>'+esc(r.source.title||r.source.ref)+'</b></span>');
  if(r.kind==='verify' || r.kind==='define' || r.kind==='word' || (r.source && r.source.seal)) steps.push('<span class="step seal">● sealed</span>');
  return '<div class="trail">'+steps.join('<span class="arr">→</span>')+'</div>';
}

// A connection is either a re-ask (stays on this one surface — the chaining workflow) or a deep link to
// a reader page (study on your own). The backend sends `connections` as card threads {title,id} and
// `next` as page links {label,ref}; the sample sends plain strings. Normalize all three honestly:
//   string / card-thread / bare title → RE-ASK in the console (chain)
//   {label, ref:"/page.html…"}        → NAVIGATE to that reader page (marked ↗)
//   label-only guidance (ref:null)    → dropped (the ask bar already invites anything)
function connItem(c){
  if(typeof c === 'string'){ const s=c.trim(); return s ? {label:s, ask:s} : null; }
  if(!c || typeof c !== 'object') return null;
  const label = String(c.label || c.title || c.text || '').trim();
  if(!label) return null;
  let ref = String(c.ref || (c.id ? '/card/'+c.id : '')).trim();
  const isPage = /^(https?:)?\//.test(ref) && !/^\/card\//.test(ref);
  if(isPage) return {label:label, href:ref};
  if(c.title || c.id) return {label:label, ask:String(c.title||label)};  // a card → re-ask, stay on surface
  return null;  // guidance-only (e.g. "ask about anything else") → not a real step
}
function renderConnections(r){
  const cs = (r.connections||[]).concat(r.next||[]).map(connItem).filter(Boolean).slice(0,5);
  if(!cs.length) return '';
  const html = cs.map(c => c.href

  const paras = String(r.caption || r.spoken || '').split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);

// The verdict badge — only for the known verify tokens the engine surfaces (true/verified · false · na,
// and the raw HOLDS/BROKEN/INCOMPLETE as a defensive fallback). Any other value (e.g. a coach "correct")
// renders no badge, so it never mislabels a non-verify answer. Found/computed by the engine, never made up.
function verdictBadge(verdict){
  if(!verdict) return '';
  const v = String(verdict).toLowerCase();
  if(v==='true' || v==='verified' || v==='holds')
    return '<div class="verdict">✓ verified true</div>';
  if(v==='false' || v==='broken')
    return '<div class="verdict no">✕ doesn’t hold</div>';
  if(v==='na' || v==='incomplete')
    return '<div class="verdict na">— can’t certify</div>';
  return '';
}

function weaveRefOf(r){
  const scripture = (r.verses && r.verses.length) || r.kind==='scripture' || r.intent==='word' || r.intent==='read';
  if(!scripture) return null;
  const h = String(r.headline||'').trim();
  if(/\d+\s*:\s*\d+/.test(h)) return h;                                   // already a verse
  if(r.verses && r.verses.length) return h.replace(/\s+/g,' ')+':'+r.verses[0].verse;  // chapter -> verse 1
  return h || null;
}

// A baked sample so the single experience renders fully in preview (and offline). On the box the
// real POST /console answers; this is only the fallback. COVENANT: it shows only found or computed
// truth — public-domain Scripture (WEB) and arithmetic it actually computes here. For every other
// door it shows the WORKFLOW SHAPE (the trail, the door, the verifier) and says plainly that the box
// answers from the keeping; it never fabricates a definition, a lexicon entry, or a verse it lacks.
const PREVIEW = 'On the box this is answered from the keeping — found, verified, and cited. This preview '
              + 'shows the shape: the door it takes, the check it runs, the source it would seal.';

function SAMPLE(text){
  const t=(text||'').toLowerCase().trim();

  // CHECK — a claim the engine can actually settle here: simple arithmetic, computed, not invented.
  const m = t.match(/(-?\d+(?:\.\d+)?)\s*([x×*+\-])\s*(-?\d+(?:\.\d+)?)\s*=\s*(-?\d+(?:\.\d+)?)/);
  if(m){
    const a=+m[1], b=+m[3], claimed=+m[4], op=m[2];
    const got = (op==='+')?a+b : (op==='-')?a-b : a*b;
    const ok = Math.abs(got-claimed) < 1e-9;
    const expr = a+' '+(op==='x'||op==='×'?'×':op)+' '+b+' = '+claimed;
    return { intent:'check', kind:'verify', headline:expr, verdict: ok?'true':'false',
      caption: ok ? 'Checked by exact arithmetic: the two sides agree.'
                  : 'Checked by exact arithmetic: the left side is '+got+', not '+claimed+'.',
      spoken: expr+(ok?' is true.':' is false; it should be '+got+'.'),
      source:{title:'exact arithmetic', seal:true},
      connections:['check: 12 × 12 = 144','what is the speed of light'] };
  }

  // CHECK — primality, COMPUTED here by trial division (not invented), mirroring the box's
  // number_theory.primality verifier so the preview shows the same verdict the engine seals.
  const pm = t.match(/\bis\s+(\d{1,7})\s+(?:a\s+)?prime(?:\s+number)?\b/);
  if(pm){
    const n=+pm[1];
    let prime=n>=2; for(let i=2;i*i<=n;i++){ if(n%i===0){ prime=false; break; } }
    let factor=''; if(!prime && n>=2){ for(let i=2;i*i<=n;i++){ if(n%i===0){ factor=i+' × '+(n/i); break; } } }
    return { intent:'check', kind:'verify', headline: prime?'It checks out.':'That does not hold.',
      verdict: prime?'true':'false',
      caption: prime ? ('Checked by the primality test: '+n+' is prime — no divisor but 1 and itself.')
                     : ('Checked by the primality test: '+n+' is not prime'+(factor?' — '+factor:'')+'.'),
      spoken: prime?(n+' is prime.'):(n+' is not prime'+(factor?'; '+factor+'.':'.')),
      source:{title:'number_theory.primality — the worked check', seal:true},
      connections:['is 17 prime?','7 × 8 = 56'] };
  }

  // CHECK — a defined physical constant (SI: c ≡ 299,792,458 m/s exactly). Found/defined, not invented.
  if(t.indexOf('speed of light')>=0 && t.replace(/[\s,]/g,'').indexOf('299792458')>=0){

      verdict:'verified',
      caption:'Checked against the defined SI value: since 1983 the metre is fixed so that c is exactly 299,792,458 metres per second. The claim matches to the stated precision.',
      spoken:'True — the speed of light in vacuum is exactly 299,792,458 metres per second, by definition.',
      source:{title:'SI definition of the metre (BIPM); CODATA', seal:true},

    return { intent:'word', kind:'search', headline:'Psalm 23',
      verses:[{verse:1,text:'The LORD is my shepherd; I shall lack nothing.'},
              {verse:2,text:'He makes me lie down in green pastures. He leads me beside still waters.'},
              {verse:3,text:'He restores my soul. He guides me in the paths of righteousness for his name’s sake.'}],
      spoken:'The LORD is my shepherd; I shall lack nothing. He makes me lie down in green pastures. He leads me beside still waters. He restores my soul.',
      source:{title:'Psalms 23 (World English Bible)', ref:'/bible.html?ref=Psalm%2023'},
      connections:['John 10:11','the original words behind “shepherd”','Isaiah 40:11'] };
  }
  if(t.indexOf('genesis 1:1')>=0){
    return { intent:'word', kind:'scripture', headline:'Genesis 1:1',
      verses:[{verse:1,text:'In the beginning, God created the heavens and the earth.'}],
      spoken:'In the beginning, God created the heavens and the earth.',
      source:{title:'Genesis 1:1 (World English Bible)', ref:'/bible.html?ref=Genesis%201:1'},
      connections:['John 1:1-3','Colossians 1:16-17','Hebrews 11:3'] };
  }
  if(t.indexOf('john 3:16')>=0){
    return { intent:'word', kind:'search', headline:'John 3:16',
      verses:[{verse:16,text:'For God so loved the world, that he gave his only born Son, that whoever believes in him should not perish, but have eternal life.'}],
      spoken:'For God so loved the world, that he gave his only born Son, that whoever believes in him should not perish, but have eternal life.',
      source:{title:'John 3:16 (World English Bible)', ref:'/bible.html?ref=John%203:16'},
      connections:['the original words behind “loved”','Romans 5:8','1 John 4:9'] };

  const nm = t.match(/^(?:note that|note:|remember that|remember:|keep this:?)\s*(.+)$/);
  if(nm){
    const said = nm[1].trim();
    return { intent:'dictate', kind:'note', headline:'Kept',
      caption:'“'+said+'”',
      spoken:'Kept, word for word.',
      source:{title:'your record · written verbatim'},
      connections:['read it back','what does the keeping say about this'] };
  }

  // WALK — a situation: one next step out, with the anchor that fits. Preview frames honestly and
  // points to an anchor verse (named, not quoted — the box fetches the verified text).
  if(/\b(i feel|i'm|i am|anxious|afraid|worried|angry|alone|lost|tempted|should i|my (wife|husband|friend|son|daughter|boss|mother|father))\b/.test(t)){
    return { intent:'walk', kind:'coach', headline:'One step from here',
      caption:PREVIEW+' A situation comes in; one next step goes out — the pattern that fits, the figures who faced it, and the anchor to stand on.',
      spoken:'On the box, this brings back one next step and the anchor that fits.',
      source:{title:'the path · matched, not guessed'},
      connections:['Philippians 4:6-7','Psalm 23','Matthew 6:34'] };
  }

  // default — the keeping answers; preview shows the shape.
  return { intent:'ask', kind:'search', headline:esc(text) || 'The keeping',
    caption:PREVIEW,
    spoken:'On the box this is answered from the keeping, found and cited.',
    source:{title:'the keeping'}, connections:['Psalm 23','define grace','check: 7 × 8 = 56','I feel anxious'] };
}

// THE HERO — land immediately in the one experience, on the verse where Scripture meets the inner
// workings of reality: "In the beginning, God created…" opens to the physics of creation beneath it.
// THE LANDING — the instrument proves itself. On arrival it runs a real check in front of you (the claim,
// the verdict, the worked trail, the source it stands on), frames it in one honest line, then invites your
// own. "↻ another" cycles what it can do, so the breadth teaches itself. Found, verified, cited — watch.
const DEMOS = [
  {q:"is 51 a prime number?",     tag:"watch it refuse a wrong answer"},
  {q:"Psalm 23:1",                tag:"watch it open the Word"},
  {q:"I’m anxious about money",   tag:"watch it meet you where you are"},
  {q:"what does ‘grace’ mean?",   tag:"watch it look one up"},
];
const EXAMPLES = [
  {k:"check a claim",   q:"is 17 a prime number?"},
  {k:"look it up",      q:"what does ‘grace’ mean?"},
  {k:"talk it through", q:"I’m anxious about money"},
  {k:"read the Bible",  q:"Psalm 23"},
];
let _demoIx = 0;

function renderHero(){
  const chips = EXAMPLES.map(e =>
    '<button data-ask="'+esc(e.q)+'"><span class="ex-k">'+esc(e.k)+'</span>'
    + '<span class="ex-q">“'+esc(e.q)+'”</span></button>').join('');
  pageEl.innerHTML =
    '<h1 class="hero-line">Ask anything. Nothing here is guessed.</h1>'
    + '<p class="hero-sub">Every answer is <b>found in a real source, checked, and cited back to it</b> — '
    + 'never generated. In a world of AI that makes things up, this one shows its work. Watch:</p>'
    + '<div class="demo" id="demo"></div>'
    + '<div class="invite"><p class="inv-lab">Now bring yours —</p>'
    + '<div class="examples">'+chips+'</div>'
    + '<button class="another" id="another">↻ show another</button></div>';
  pageEl.querySelectorAll('.examples [data-ask]').forEach(b=> b.onclick=()=>ask(b.dataset.ask));
  const an=document.getElementById('another'); if(an) an.onclick=()=>{ _demoIx=(_demoIx+1)%DEMOS.length; runDemo(); };
  runDemo();
}

function runDemo(){
  const d = DEMOS[_demoIx], box = document.getElementById('demo');
  if(!box) return;
  box.innerHTML = '<span class="tag">'+esc(d.tag)+'</span><div class="dim" style="padding:.3rem 0">checking “'+esc(d.q)+'” …</div>';
  fetch(API+'/console',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:d.q})})
    .then(r=> r.ok ? r.json() : Promise.reject())
    .then(a=> renderDemoInto(box, d, a))
    .catch(()=> renderDemoInto(box, d, SAMPLE(d.q)));
}

function renderDemoInto(box, d, a){
  if(!box) return;
  let h = '<span class="tag">'+esc(d.tag)+'</span>';
  h += '<div class="claim">'+esc(a.headline || d.q)+'</div>';
  h += verdictBadge(a.verdict);
  if(a.verses && a.verses.length){
    h += '<div class="body">'+a.verses.slice(0,2).map(v=>'<p><span class="vn">'+esc(v.verse)+'</span>'+esc(v.text)+'</p>').join('')+'</div>';
  } else {
    const line=String(a.caption||a.spoken||'').split(/\n{2,}/)[0];
    if(line) h += '<div class="body"><p>'+esc(line)+'</p></div>';
  }
  if(a.source && (a.source.title||a.source.ref)) h += '<div class="d-src">source · '+esc(a.source.title||a.source.ref)+'</div>';
  h += trailOf(a);
  box.innerHTML = h;
}

document.getElementById('greet') && (document.getElementById('greet').style.display='none');
renderHero();
</script>
